name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this publish is being triggered manually"
        required: false
        default: "manual trigger"

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - name: Setup Node for npm publish
        uses: actions/setup-node@v7
        with:
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            if bun install --frozen-lockfile; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "bun install failed; retrying in 5 seconds..."
            sleep 5
          done

      - name: Run tests
        run: bun test

      - name: Verify extension compiles
        run: bun build index.ts --no-bundle --outfile /tmp/pi-herdr-build.js

      - name: Set version from release tag
        run: |
          TAG="${GITHUB_REF_NAME}"  # e.g. v0.1.0-dev.42 or v0.1.0
          VERSION="${TAG#v}"        # strip leading v
          npm version "${VERSION}" --no-git-tag-version --allow-same-version

      - name: Check NPM_TOKEN is set
        if: ${{ env.NPM_TOKEN == '' }}
        run: |
          echo "NPM_TOKEN secret is not set. Add it via:" 
          echo "  gh secret set NPM_TOKEN --repo sfroment/pi-herdr"
          echo "or repo Settings > Secrets and variables > Actions > New repository secret."
          exit 1
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
