name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            if bun install --frozen-lockfile; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "bun install failed; retrying in 5 seconds..."
            sleep 5
          done

      - name: Run tests
        run: bun test

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE_VERSION=$(node -p "require('./package.json').version")
          TAG="v${BASE_VERSION}-dev.${{ github.run_number }}"
          gh release create "${TAG}" \
            --target main \
            --title "${TAG}" \
            --notes "Auto-release from commit ${{ github.sha }}" \
            --prerelease
